[package]
name = "mqtt-persist"
version = "0.1.0"
edition = "2021"
description = "A resilient MQTT client with offline message queuing and automatic reconnection"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/mqtt-persist"
keywords = ["mqtt", "persistence", "offline", "queue", "iot"]
categories = ["network-programming", "embedded"]
readme = "README.md"

[dependencies]
rumqttc = "0.25"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
url = "2.0"

[dev-dependencies]
tokio-test = "0.4"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "temperature_sensor"
path = "examples/temperature_sensor.rs"

[[example]]
name = "advanced_config"
path = "examples/advanced_config.rs"

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"
